<nav class="nav-bar">
  <div class="nav-container">
    <!-- Logo with router link -->
    <div class="nav-logo">
      <a routerLink="/" aria-label="Home"> <!-- Changed from href to routerLink -->
        <img
          src="/assets/images/logo.png"
          alt="NJ Logo" class="logo-img" />
      </a>
    </div>

    <!-- Desktop Navigation -->
    <ul class="nav-menu desktop-nav">
      @for (link of navLinks; track link; let i = $index) {
      <li>
        <a [routerLink]="link.href" class="nav-link" routerLinkActive="active"> <!-- Changed to routerLink -->
          <span class="nav-number">0{{ i + 1 }}.</span>
          <span class="nav-label">{{ link.label }}</span>
        </a>
      </li>
      }
    </ul>

    <!-- Theme toggle -->
    <button class="theme-toggle" (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (themeService.theme() === 'dark') {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      } @else {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      }
    </button>

    <!-- Resume button remains the same -->
    <button class="resume-btn" (click)="downloadResume()" aria-label="Download resume">
      <span>Resume</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    </button>

    <!-- Mobile Menu Toggle remains the same -->
    <button class="mobile-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen" aria-label="Toggle menu"
      aria-expanded="isMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Navigation Overlay -->
  <div class="mobile-overlay" [class.open]="isMenuOpen" (click)="toggleMenu()"></div>

  <!-- Mobile Navigation -->
  <div class="mobile-nav" [class.open]="isMenuOpen">
    <ul class="mobile-nav-links">
      @for (link of navLinks; track link; let i = $index) {
      <li [style.animation-delay]="(i * 0.05) + 's'">
        <a [routerLink]="link.href" class="nav-link" (click)="toggleMenu()" routerLinkActive="active"> <!-- Changed to routerLink -->
          <span class="nav-number">0{{ i + 1 }}.</span>
          <span class="nav-label">{{ link.label }}</span>
        </a>
      </li>
      }
      <li style="animation-delay: 0.2s">
        <button class="theme-toggle mobile" (click)="themeService.toggleTheme()"
          [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
          @if (themeService.theme() === 'dark') {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <span>Light Mode</span>
          } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span>Dark Mode</span>
          }
        </button>
      </li>
      <li style="animation-delay: 0.25s">
        <button class="resume-btn mobile" (click)="downloadResume(); toggleMenu()">
          <span>Resume</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
      </li>
    </ul>
  </div>
</nav>
